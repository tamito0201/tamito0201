<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="889" viewBox="0 0 1100 889" role="img" aria-labelledby="title desc"><title id="title">Selected engineering career milestones</title><desc id="desc">A career beginning in 2004, spanning enterprise Java, financial-system integration, founding a company, mobile architecture, AWS batch platforms, multi-cloud SRE, a July 2024 SaaS launch, and current applied AI.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1100" height="889" rx="20" fill="#0b1220" /><text x="42" y="54" font-size="33" fill="#f2f6fc" font-weight="700" >Two decades. Increasing system scope.</text><text x="44" y="89" font-size="18" fill="#a7b8ce" font-weight="550" >SELECTED ENGINEERING MILESTONES / 2004 → TODAY</text><line x1="182" y1="145" x2="182" y2="763" stroke="#356270" stroke-width="3"/><text x="43" y="161" font-size="20" fill="#82b8ff" font-weight="650" >2004</text><circle cx="182" cy="154" r="7" fill="#82b8ff"/><text x="216" y="157" font-size="23" fill="#f2f6fc" font-weight="650" >Enterprise Java foundations</text><text x="217" y="188" font-size="17" fill="#a7b8ce" font-weight="400" >Business systems, application frameworks, profiling, and quality.</text><text x="43" y="247" font-size="20" fill="#82b8ff" font-weight="650" >2007–10</text><circle cx="182" cy="240" r="7" fill="#82b8ff"/><text x="216" y="243" font-size="23" fill="#f2f6fc" font-weight="650" >Financial-system integration</text><text x="217" y="274" font-size="17" fill="#a7b8ce" font-weight="400" >PMO, ITIL configuration management, approval workflows, and tooling.</text><text x="43" y="333" font-size="20" fill="#83f2c4" font-weight="650" >2015</text><circle cx="182" cy="326" r="7" fill="#83f2c4"/><text x="216" y="329" font-size="23" fill="#f2f6fc" font-weight="650" >Founder and hands-on engineer</text><text x="217" y="360" font-size="17" fill="#a7b8ce" font-weight="400" >Built a business around software delivery; continued product development.</text><text x="43" y="419" font-size="20" fill="#82b8ff" font-weight="650" >2019–20</text><circle cx="182" cy="412" r="7" fill="#82b8ff"/><text x="216" y="415" font-size="23" fill="#f2f6fc" font-weight="650" >Mobile and product architecture</text><text x="217" y="446" font-size="17" fill="#a7b8ce" font-weight="400" >Retail apps, content delivery, Flutter adoption, and smart-glasses prototypes.</text><text x="43" y="505" font-size="20" fill="#ffd59a" font-weight="650" >2021</text><circle cx="182" cy="498" r="7" fill="#ffd59a"/><text x="216" y="501" font-size="23" fill="#f2f6fc" font-weight="650" >AWS batch platforms</text><text x="217" y="532" font-size="17" fill="#a7b8ce" font-weight="400" >SQS / Batch, CDK, automated environments, CloudWatch, and Sentry.</text><text x="43" y="591" font-size="20" fill="#ffd59a" font-weight="650" >2022</text><circle cx="182" cy="584" r="7" fill="#ffd59a"/><text x="216" y="587" font-size="23" fill="#f2f6fc" font-weight="650" >Multi-cloud SRE technical lead</text><text x="217" y="618" font-size="17" fill="#a7b8ce" font-weight="400" >AWS ECS + Google Cloud Run, Terraform, Docker, and automated releases.</text><text x="43" y="677" font-size="20" fill="#83f2c4" font-weight="650" >2024</text><circle cx="182" cy="670" r="7" fill="#83f2c4"/><text x="216" y="673" font-size="23" fill="#f2f6fc" font-weight="650" >SaaS from an empty repository</text><text x="217" y="704" font-size="17" fill="#a7b8ce" font-weight="400" >Go backend + Rails BFF; product released in July 2024.</text><text x="43" y="763" font-size="20" fill="#83f2c4" font-weight="650" >TODAY</text><circle cx="182" cy="756" r="7" fill="#83f2c4"/><text x="216" y="759" font-size="23" fill="#f2f6fc" font-weight="650" >Backend, cloud, and applied AI</text><text x="217" y="790" font-size="17" fill="#a7b8ce" font-weight="400" >Data history, agents, RAG, MCP, streaming UX, and developer tooling.</text><text x="44" y="861" font-size="16" fill="#a7b8ce" font-weight="400" >Career record + public project portfolio. Selected milestones; rows are not a time scale.</text></g></svg>
